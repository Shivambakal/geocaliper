<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geospatial Measurement API — demo</title>
<style>
  :root { color-scheme: light; }
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.4rem; }
  p.sub { color: #666; margin-top: -0.5rem; }
  #drop { border: 2px dashed #aaa; border-radius: 8px; padding: 2.5rem 1rem; text-align: center; color: #555; cursor: pointer; }
  #drop.over { border-color: #333; background: #f7f7f7; }
  textarea { width: 100%; height: 120px; margin-top: 1rem; font-family: monospace; font-size: 0.85rem; }
  button { margin-top: 0.75rem; padding: 0.5rem 1.25rem; font-size: 1rem; cursor: pointer; }
  #out { margin-top: 1.5rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 0.5rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
  th { color: #555; font-weight: 600; }
  .err { color: #a00; }
  .muted { color: #777; font-size: 0.85rem; }
  pre { background: #f4f4f4; padding: 0.75rem; border-radius: 6px; overflow-x: auto; font-size: 0.8rem; }
</style>
</head>
<body>
  <h1>Geospatial Measurement API</h1>
  <p class="sub">Drop a <code>.geojson</code> or <code>.dxf</code> file, or paste raw GeoJSON below.</p>

  <div id="drop">Drop file here, or click to choose</div>
  <input type="file" id="file" accept=".geojson,.json,.dxf" hidden>

  <textarea id="raw" placeholder='{"type": "FeatureCollection", "features": [...]}'></textarea>
  <br>
  <button id="sendRaw">Measure pasted GeoJSON</button>

  <div id="out"></div>

<script>
const out = document.getElementById('out');
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');

function showResult(r) {
  const m = r.result.measurements;
  let rows = Object.entries(m).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  out.innerHTML = `
    <h3>Result</h3>
    <table>
      <tr><th>measurement</th><th>value</th></tr>
      ${rows}
      <tr><td>geometry type</td><td>${r.result.geometry_type}</td></tr>
      <tr><td>CRS</td><td>${r.result.detected_crs}</td></tr>
      <tr><td>conversion</td><td>${r.result.conversion_details || '—'}</td></tr>
      <tr><td>id</td><td class="muted">${r.measurement_id}</td></tr>
    </table>
    ${r.errors.length ? `<p class="err">warnings: ${r.errors.join('; ')}</p>` : ''}
    <details><summary class="muted">raw JSON</summary><pre>${JSON.stringify(r, null, 2)}</pre></details>`;
}

function showError(msg) {
  out.innerHTML = `<p class="err">${msg}</p>`;
}

async function measureFile(f) {
  const fd = new FormData();
  fd.append('file', f);
  out.innerHTML = '<p class="muted">measuring…</p>';
  const res = await fetch('/api/v1/measurements', { method: 'POST', body: fd });
  const body = await res.json();
  res.ok ? showResult(body) : showError(body.detail || 'request failed');
}

drop.onclick = () => fileInput.click();
fileInput.onchange = e => e.target.files[0] && measureFile(e.target.files[0]);
['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; f && measureFile(f); });

document.getElementById('sendRaw').onclick = async () => {
  const raw = document.getElementById('raw').value.trim();
  if (!raw) return showError('paste some GeoJSON first');
  out.innerHTML = '<p class="muted">measuring…</p>';
  const res = await fetch('/api/v1/measurements/geojson', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: raw });
  const body = await res.json();
  res.ok ? showResult(body) : showError(body.detail || 'request failed');
};
</script>
</body>
</html>
